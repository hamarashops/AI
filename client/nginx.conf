server {
    listen 80;
    server_name hamarashops.ai;

    # Add the HSTS header. This tells browsers to always use HTTPS.
    # The max-age is set to one year (31536000 seconds).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Allow the ACME challenge to bypass the React routing
    location /.well-known/acme-challenge/ {
        # Let it fail to disk so Cloud Run's proxy can intercept it
        try_files $uri =404;
    }

    # Your existing React SPA catch-all
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
